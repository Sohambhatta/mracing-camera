[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mracing-camera"
version = "0.1.0"
description = "Local camera capture and cone detection for MRacing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
inference = ["torch", "ultralytics"]
basler = ["pypylon"]
test = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
